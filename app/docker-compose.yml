services:
  backend:
    image: ottobiz:latest
    pull_policy: always
    build:
      context: .
      dockerfile: dockerfile
    restart: always
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-ottobiz}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redispassword}@redis:6379/0
      - LOG_FILE=/tmp/app.log
      - MODEL_NAME=${MODEL_NAME:-}
      - MODEL_API_KEY=${MODEL_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LOGFIRE_TOKEN=${LOGFIRE_TOKEN:-}
      - DEBUG=${DEBUG:-}
      - VERIFY_TOKEN=${VERIFY_TOKEN:-}
      - APP_SECRET=${APP_SECRET:-}
      - PAGE_ACCESS_TOKEN=${PAGE_ACCESS_TOKEN:-}
      - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID:-}
      - SEED_BUSINESS_NAME=${SEED_BUSINESS_NAME:-}
      - SEED_BUSINESS_PHONE=${SEED_BUSINESS_PHONE:-}
      - SEED_BUSINESS_ID=${SEED_BUSINESS_ID:-}
      - SEED_PRODUCTS_CSV=${SEED_PRODUCTS_CSV:-}
      - SEED_CONTACTS_CSV=${SEED_CONTACTS_CSV:-}
      - SEED_SELF_VENDOR=${SEED_SELF_VENDOR:-}
      - SEED_SELF_VENDOR_NAME=${SEED_SELF_VENDOR_NAME:-}
      - SEED_SELF_VENDOR_ROLE=${SEED_SELF_VENDOR_ROLE:-}
      - SEED_SELF_VENDOR_NOTES=${SEED_SELF_VENDOR_NOTES:-}
    networks:
      - default
      - dokploy-network
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    mem_limit: 512m
    cpus: 1.0
    labels:
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.ottobiz-backend-d39hm2-4-web.rule=Host(`api.ottobiz.net`)
      - traefik.http.routers.ottobiz-backend-d39hm2-4-web.entrypoints=web
      - traefik.http.services.ottobiz-backend-d39hm2-4-web.loadbalancer.server.port=8000
      - traefik.http.routers.ottobiz-backend-d39hm2-4-web.service=ottobiz-backend-d39hm2-4-web
      - traefik.http.routers.ottobiz-backend-d39hm2-4-web.middlewares=redirect-to-https@file
      - traefik.http.routers.ottobiz-backend-d39hm2-4-websecure.rule=Host(`api.ottobiz.net`)
      - traefik.http.routers.ottobiz-backend-d39hm2-4-websecure.entrypoints=websecure
      - traefik.http.services.ottobiz-backend-d39hm2-4-websecure.loadbalancer.server.port=8000
      - traefik.http.routers.ottobiz-backend-d39hm2-4-websecure.service=ottobiz-backend-d39hm2-4-websecure
      - traefik.http.routers.ottobiz-backend-d39hm2-4-websecure.tls.certresolver=letsencrypt
      - traefik.enable=true
  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-ottobiz}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - default
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ottobiz}
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-redispassword} --maxmemory 96mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - default
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redispassword}
    mem_limit: 128m
    cpus: 0.25
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG
      interval: 10s
      timeout: 3s
      retries: 5
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
networks:
  default: null
  dokploy-network:
    external: true